<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: projector host = header meters + stage (left) + body map & 6 probe cards (right); phone = one team's controller */
:root{color-scheme:dark;--bg:#0b0607;--bg2:#140b0c;--card:#1c1213;--card2:#26181a;--line:#3a2627;--line2:#55393a;--ink:#f8eceb;--muted:#c2a4a5;--dim:#8a6f70;
 --coral:#f15b5c;--blood:#b3262b;--gold:#f2c14e;--ok:#5fd18b;--no:#ff6b6b;--on:#160708;
 --a0:#e5484d;--a1:#3e7bfa;--a2:#e8a317;--a3:#2fa86b;
 --f:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;--d:"Barlow Condensed","Arial Narrow",sans-serif;--jp:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--d);font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--coral);font-size:clamp(13px,1vw,17px)}
em{font-style:normal;color:var(--coral)} em.no{color:var(--dim)}
#app.fresh{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}

.go{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:var(--coral);color:var(--on);font-weight:900;font-size:clamp(17px,1.3vw,22px);padding:14px 28px;min-height:52px;box-shadow:0 0 30px rgba(241,91,92,.35)}
.go.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line2)}
.ib{border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px}
.ib.sm{padding:5px 10px;font-size:12.5px}
.lnk{border:0;background:none;color:var(--muted);text-decoration:underline;font-weight:800;font-size:14px}
.net{font-size:12.5px;font-weight:800;color:var(--dim);display:inline-flex;align-items:center;gap:6px}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dim)}
.net.on{color:var(--ok)}.net.on::before{background:var(--ok);box-shadow:0 0 0 3px rgba(95,209,139,.2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);padding:12px 18px;border-radius:12px;font-weight:800;z-index:50;max-width:90vw}

/* ===== HOST ===== */
body.host{min-height:100vh;background:radial-gradient(120% 90% at 30% 0%,#2a0d0f 0%,var(--bg) 55%)}
.hh{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand .kj{font-family:var(--jp);font-weight:900;font-size:36px;color:var(--coral);text-shadow:0 0 18px rgba(241,91,92,.7)}
.brand b{display:block;font-family:var(--d);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:1px;line-height:1}
.brand small{color:var(--muted);font-weight:700;font-size:13px}
.meters{display:flex;gap:22px;flex:1;justify-content:center}
.m{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;color:var(--muted)}
.m b{font-family:var(--d);font-size:24px;color:var(--ink);min-width:62px}
.bar{width:clamp(120px,14vw,260px);height:10px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fa9f5,#7fd3ff);transition:width .6s}
.bar.gold i{background:linear-gradient(90deg,var(--blood),var(--gold))}
.hc{display:flex;gap:8px;align-items:center}
.hm{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.95fr);gap:22px;padding:20px 24px;min-height:calc(100vh - 70px)}
.stage{min-width:0;display:flex;flex-direction:column;justify-content:center}
.side{min-width:0;display:flex;flex-direction:column;gap:12px}
.side .ctl{margin-top:auto;display:flex;justify-content:flex-end}
.body{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:14px}
.giant>*{fill:#1d0f10;stroke:#5a2a2c;stroke-width:2}.giant .seg,.giant .gill,.giant .limb,.giant .claw{fill:none;stroke:#4a2224;stroke-width:2}.giant .limb{stroke:#2a1516;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}.giant .claw{stroke:#5a2a2c;stroke-width:4;stroke-linecap:round}.giant .spk,.giant .horn{fill:#2a1415}.giant .jaw{fill:#241112}.giant .tail{fill:#3a1418;stroke:#8a3a44}.giant .gill{stroke:#6b2a30;stroke-width:3}
.giant .hair{fill:#140909}.giant .arm{fill:#241314}
.giant ellipse{stroke:none}
.route{fill:none;stroke:rgba(241,91,92,.35);stroke-width:2.5;stroke-dasharray:6 8}
.zn .halo{fill:rgba(241,91,92,.08);stroke:rgba(241,91,92,.35)}
.zn .core{fill:#2a1617;stroke:#6b3a3c;stroke-width:2}
.zn .zk{font-family:var(--jp);font-weight:900;font-size:17px;text-anchor:middle;fill:#a98c8d}
.zn .zl{paint-order:stroke;stroke:#0b0607;stroke-width:5px;font-family:var(--d);font-weight:800;font-size:19px;fill:#a98c8d;letter-spacing:.5px}
.zn.lit .core{fill:var(--gold);stroke:#fff3}.zn.lit .zk{fill:#2a1300}.zn.lit .halo{fill:rgba(242,193,78,.25);stroke:var(--gold)}.zn.lit .zl{fill:var(--gold)}
.zn.dim .core{fill:#3a1516;stroke:var(--blood)}.zn.dim .zk{fill:#ff9a9a}
.zn.now .core{fill:var(--coral);stroke:#fff}.zn.now .zk{fill:#fff}.zn.now .zl{fill:#fff}
.zn.now .halo{fill:rgba(241,91,92,.25);stroke:var(--coral);animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.55}}
.probe{stroke:#fff;stroke-width:2;filter:url(#gl)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:12px;padding:9px 11px;min-width:0}
.tc .tk{font-family:var(--jp);font-weight:900;font-size:22px;color:var(--tc);line-height:1}
.tc .ti{min-width:0}.tc .ti b{display:block;font-weight:900;font-size:15.5px;line-height:1.15}.tc .ti small{color:var(--dim);font-weight:700;font-size:12px}
.tc .tr{text-align:right;display:grid;gap:2px;justify-items:end}
.tc .sc{font-family:var(--d);font-weight:900;font-size:24px;line-height:1}
.tc .bd{grid-column:1/-1}
.sh{color:#3a2a2b;font-size:15px;letter-spacing:1px}.sh.on{color:#7fd3ff;text-shadow:0 0 8px rgba(127,211,255,.6)}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900}
.st.ok{background:rgba(95,209,139,.15);color:var(--ok)}.st.no{background:rgba(255,107,107,.15);color:var(--no)}.st.wait{background:var(--card2);color:var(--dim)}
.rip{font-size:12px;font-weight:900;color:var(--no)}
.tc.dead{opacity:.55;border-left-style:dashed}
.tc.boom{animation:boom .9s ease-out}@keyframes boom{0%{box-shadow:0 0 0 0 rgba(255,107,107,.9);transform:scale(1.04)}100%{box-shadow:0 0 0 22px rgba(255,107,107,0);transform:scale(1)}}
.tc.off{opacity:.45}
.mini{grid-column:1/-1;display:flex;gap:4px}
.mini button{flex:1;border:1px solid var(--line2);background:var(--bg2);border-radius:7px;padding:3px 0;font-size:12px;font-weight:900;color:var(--muted)}
.mini button.sel{background:var(--ink);color:var(--bg)}
.lob{grid-template-columns:minmax(0,1.3fr) minmax(360px,.9fr)}
.lobby{display:grid;gap:26px;align-content:center}
.lobby h1,.brief h1,.risk h1,.final h1,.zres h1{font-family:var(--d);font-weight:900;text-transform:uppercase;line-height:.95;margin:6px 0 0;font-size:clamp(44px,5.4vw,96px)}
.story{font-size:clamp(17px,1.4vw,22px);color:var(--muted);max-width:60ch;margin:14px 0}
.rules{margin:0;padding-left:20px;display:grid;gap:6px;font-size:clamp(15px,1.15vw,19px);color:var(--muted)}
.rules b{color:var(--ink)}
.join{display:flex;gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.qr{width:clamp(140px,12vw,210px);background:#fff;border-radius:10px;padding:6px;flex:0 0 auto}.qr svg{display:block;width:100%;height:auto}
.url{font-weight:800;font-size:clamp(15px,1.2vw,20px);margin:6px 0;word-break:break-all}
.code{font-weight:800;color:var(--muted);font-size:18px}.code b{font-family:var(--d);font-size:clamp(40px,3.6vw,64px);color:var(--gold);letter-spacing:6px;margin-left:8px;vertical-align:-6px}
.zhead{display:flex;gap:20px;align-items:center}
.zhead .zk{font-family:var(--jp);font-weight:900;font-size:clamp(64px,6vw,110px);line-height:1;color:var(--coral);text-shadow:0 0 30px rgba(241,91,92,.6)}
.zhead .zk.lit{color:var(--gold);text-shadow:0 0 30px rgba(242,193,78,.6)}
.les{font-weight:800;color:var(--muted);font-size:clamp(16px,1.3vw,21px);margin-top:6px}
.pts{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:p}
.pts li{counter-increment:p;display:grid;grid-template-columns:42px 1fr;gap:12px;font-size:clamp(18px,1.55vw,27px);line-height:1.35;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.pts li>span{min-width:0}
.pts li::before{content:counter(p);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--coral);color:var(--on);font-weight:900;font-size:18px}
.pts b{color:var(--gold)}
.hint{color:var(--dim);font-weight:800;margin:14px 0 0}
.qh{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tag{background:var(--coral);color:var(--on);font-weight:900;border-radius:999px;padding:4px 12px;font-size:14px}
.zn2{font-weight:800;color:var(--muted)}.qn{margin-left:auto;font-family:var(--d);font-weight:900;font-size:22px;color:var(--muted)}
.qrow{display:flex;gap:20px;align-items:center;margin:16px 0 18px}
.qt{font-size:clamp(26px,2.5vw,46px);line-height:1.18;margin:0;flex:1;font-weight:900;text-wrap:balance}
.timer{position:relative;width:clamp(84px,7vw,120px);flex:0 0 auto;aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tbg{fill:none;stroke:var(--card2);stroke-width:9}
.timer .tfg{fill:none;stroke:var(--coral);stroke-width:9;stroke-linecap:round;stroke-dasharray:276.5;transition:stroke-dashoffset .2s linear}
.timer .tfg.hot{stroke:var(--gold)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--d);font-weight:900;font-size:clamp(30px,2.6vw,46px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op{display:flex;gap:12px;align-items:center;border-radius:14px;padding:16px 18px;font-weight:800;font-size:clamp(17px,1.45vw,25px);line-height:1.25;color:#fff;min-height:84px;transition:opacity .3s,transform .3s}
.op .ol{font-family:var(--d);font-weight:900;font-size:1.1em;opacity:.9;flex:0 0 auto}
.c0{background:var(--a0)}.c1{background:var(--a1)}.c2{background:var(--a2)}.c3{background:var(--a3)}
.op .otx{flex:1}.pk{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:42%}.pk i{font:900 19px/1 var(--jp,var(--f));font-style:normal;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#140808;color:var(--tc);box-shadow:0 0 0 2px var(--tc),0 0 14px var(--tc);animation:pkin .45s calc(.2s + var(--i)*.16s) cubic-bezier(.2,1.6,.4,1) both}@keyframes pkin{from{opacity:0;transform:translateY(-46px) scale(1.9)}}#qhint b{color:var(--gold);font-size:1.15em}.op.wrong{opacity:.3}.op.right{transform:scale(1.02);box-shadow:0 0 0 4px #fff,0 0 30px rgba(255,255,255,.35)}
.why{margin-top:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:14px 18px;font-size:clamp(16px,1.3vw,22px);line-height:1.4}
.why b{color:var(--gold)}
.rc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
.rc>div{border-radius:16px;padding:20px;display:grid;gap:8px;font-size:clamp(16px,1.3vw,22px)}
.rc b{font-family:var(--d);font-weight:900;font-size:clamp(28px,2.4vw,42px);text-transform:uppercase}
.rc .r1{background:linear-gradient(160deg,#4a1416,#1c1213);border:2px solid var(--coral)}.rc .r1 b{color:var(--coral)}
.rc .r2{background:var(--card);border:2px solid var(--line2)}
.risk .timer{margin:0 auto}
.fix{font-weight:800;color:var(--ok);font-size:18px}
.lb{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:8px;counter-reset:l}
.lb li{counter-increment:l;display:grid;grid-template-columns:34px 58px 1fr auto 70px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:12px;padding:10px 14px;font-size:clamp(16px,1.3vw,22px)}
.lb li::before{content:counter(l);font-family:var(--d);font-weight:900;font-size:24px;color:var(--muted)}
.lb .tk{font-family:var(--jp);font-weight:900;color:var(--tc);font-size:24px;white-space:nowrap}
.lb .num{font-family:var(--d);font-weight:900;font-size:26px;text-align:right}
.lb li.dead{opacity:.55}
.pod{display:grid;gap:10px;margin-top:22px}
.pr{display:grid;grid-template-columns:44px 64px 1fr auto 90px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:12px 16px;font-size:clamp(17px,1.4vw,24px)}
.pr .pn{font-family:var(--d);font-weight:900;font-size:34px;color:var(--muted)}
.pr.first{background:linear-gradient(90deg,rgba(242,193,78,.18),var(--card));border-color:var(--gold)}.pr.first .pn{color:var(--gold)}
.pr .tk{font-family:var(--jp);font-weight:900;font-size:28px;color:var(--tc);white-space:nowrap}
.pr small{color:var(--muted);font-weight:700}
.pr .ps{font-family:var(--d);font-weight:900;font-size:34px;text-align:right}
.pr.dead{opacity:.6}
.zones{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.zones span{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-weight:800;color:var(--dim)}
.zones span.lit{border-color:var(--gold);color:var(--gold)}
@media (max-width:1100px){.hm,.lob{grid-template-columns:1fr}.meters{display:none}}

/* ===== PHONE ===== */
body.phone{min-height:100dvh}
.ph{padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;display:grid;gap:12px}
.ph h1{font-family:var(--d);font-weight:900;font-size:40px;line-height:1;text-transform:uppercase;margin:0}
.ph.center,.center{text-align:center;justify-items:center;align-content:center;min-height:60vh;display:grid;gap:10px}
.gate input{font:inherit;font-size:30px;text-align:center;letter-spacing:8px;padding:12px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink);width:100%}
.gate label{font-weight:800;color:var(--muted)}
.muted{color:var(--muted)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--card2);border-top-color:var(--coral);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

.pick .tk{font-family:var(--jp);font-weight:900;font-size:28px;color:var(--tc)}
.pick b{font-weight:900;font-size:17px}.pick small{color:var(--muted);font-weight:700;font-size:12.5px}
.pt{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,var(--bg)),var(--bg));border-bottom:2px solid var(--tc)}
.pt .tk{font-family:var(--jp);font-weight:900;font-size:30px;color:var(--tc)}
.pt b{display:block;font-weight:900;font-size:17px}.pt small{font-size:13px;color:var(--muted);font-weight:800}

.big.okc{color:var(--ok)}.big.noc{color:var(--no)}
.okt{color:var(--ok);font-weight:800}.noc{color:var(--no);font-weight:800}
.ans{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:800;text-align:left;width:100%}
.pm .why{font-size:15px;color:var(--muted);text-align:left;margin:0}
.pbtn{display:grid;gap:10px}

.pbtn .ol{font-family:var(--d);font-weight:900;font-size:20px;flex:0 0 auto}
.pbtn button.sel{box-shadow:0 0 0 4px #fff}.pbtn button.dimb{opacity:.3}
.ghostb{background:rgba(255,107,107,.12);border:1px solid var(--no);color:var(--no);font-weight:800;border-radius:10px;padding:8px 12px;margin-bottom:8px}
.rk{display:grid;gap:12px}

.mem{display:block;margin-top:3px;font-size:12px;font-weight:800;color:var(--gold,#e7b54c);white-space:normal;line-height:1.3}
</style></head><body>

    ["Nhận xét nào đúng tinh thần soi clip?", ["“Mình sẽ đứng chéo 45° thay vì trước mặt khách”", "“PT này dạy chưa nhiệt tình”", "“Clip này dạy sai hết”", "“Khách tập kém quá”"], "Nhận xét tốt là một hành động cụ thể mình sẽ làm khác."],
    ["Vì sao phần soi clip được đặt lên đầu buổi học?", ["Để PT thấy vì sao cần học trước khi học kỹ thuật", "Vì clip ngắn nhất", "Để chấm điểm PT", "Để giải trí"], "Nhìn thấy khoảng cách giữa cách mình đang dạy và chuẩn mới tạo ra lý do để học."],
   ],
   rare: ["Câu nào giúp PT đạt mục tiêu của phần soi clip?", ["“Từ mai, khi kèm khách, em sẽ nói cue ngắn hơn”", "“Em thấy clip hay”", "“PT trong clip nên tập lại từ đầu”", "“Em không cần thay đổi gì”"], "Đạt khi mỗi PT nói được ít nhất 1 điều cụ thể mình sẽ làm khác."] },

 { id: "foot", kj: "足", name: "Bàn Chân", lesson: "Stance · đứng trước khi squat", x: 945, y: 150,
   brief: ["3 điểm chốt: <b>rộng chân</b> bằng vai đến hơn vai chút · <b>mũi chân mở</b> 15–30° (kim 11 giờ và 1 giờ) · <b>bám 3 điểm</b> gót, gốc ngón cái, gốc ngón út.", "Vì sao: đùi dạng và xoay ngoài nên cổ xương đùi tránh mép ổ cối, xuống sâu không cấn háng; hai đùi tách ra tạo chỗ cho bụng.", "Hông mỗi người một khác: <b>linh hoạt độ rộng, không linh hoạt kỹ thuật</b>.", "Thử độ mở hợp: quỳ 4 điểm, thử gối hẹp, vừa, rộng rồi ngồi lùi về gót."],
   qs: [
    ["3 điểm bám của bàn chân là gì?", ["Gót, gốc ngón cái, gốc ngón út", "Mũi chân, gót, mắt cá", "Gót, lòng bàn chân, ngón út", "Ngón cái, ngón út, mu bàn chân"], "Ba điểm cùng ép sàn thì chân đế vững, gót không nhấc, gối giữ được hướng."],
    ["Mũi chân trong stance nên thế nào?", ["Mở ra ngoài khoảng 15–30°", "Thẳng tắp về trước", "Mở rộng như kim 9 giờ và 3 giờ", "Chụm vào trong"], "Mở nhẹ thì gối có đường đi theo ngón chân 2–3 mà không bị kẹt ở hông."],
    ["Vì sao đứng rộng và mở mũi chân giúp khách xuống sâu hơn?", ["Cổ xương đùi tránh được mép ổ cối nên không cấn háng", "Giúp khách đứng cao hơn", "Làm gối khóa chặt", "Giảm hoạt động của cơ mông"], "Khớp háng là khớp cầu: gập sâu thì cổ xương đùi sát mép ổ cối. Đùi dạng, xoay ngoài sẽ tránh được mép đó."],
    ["Khách hỏi: “Em đứng rộng hơn chị kia, có sai không?”", ["Không sai: độ rộng linh hoạt theo hông, kỹ thuật thì không", "Sai, ai cũng phải đứng đúng bằng vai", "Sai, em phải đứng hẹp lại", "Đứng sao cũng được, không quan trọng"], "Ổ cối và cổ xương đùi mỗi người một góc. Điều không đổi: gối theo mũi chân, bám 3 điểm, gót không nhấc."],
   ],
   rare: ["Cách thử tìm độ mở chân hợp với từng khách?", ["Quỳ 4 điểm, thử gối hẹp, vừa, rộng rồi ngồi lùi về gót", "Đo chiều cao của khách", "Cho khách chạy bộ 5 phút", "Hỏi khách thích đứng thế nào"], "Độ mở nào lùi được sâu nhất mà lưng vẫn thẳng, không cấn háng thì dùng độ mở đó khi đứng."] },

 { id: "lung", kj: "肺", name: "Phổi", lesson: "Breathing · thở đúng nhịp", x: 330, y: 182,
   brief: ["Mỗi rep chỉ có <b>2 nhịp thở</b>: <b>vừa xuống vừa hít vào</b>, đứng lên tới <b>điểm cao nhất thì thở ra</b>.", "Vì sao: hơi thở đi cùng chuyển động nên dễ giữ nhịp; không nín thở cả set; PT nghe tiếng thở là biết khách ở pha nào.", "Dấu hiệu nín thở: <b>im lặng, mặt đỏ, môi mím</b>, rep chậm dần.", "Cue: “Xuống, hít vào” · “Đứng thẳng, thở ra”."],
   qs: [
    ["Trong Goblet Squat, khi nào hít vào?", ["Vừa đi xuống vừa hít vào", "Khi đứng lên", "Nín thở ở đáy rồi mới hít", "Lúc nào cũng được"], "Hít vào trong pha đi xuống."],
    ["Khi nào thở ra?", ["Khi đã đứng thẳng ở điểm cao nhất", "Khi bắt đầu đi xuống", "Ngay ở đáy", "Không cần thở ra"], "Đứng lên tới điểm cao nhất thì thở ra. Mỗi rep một hơi."],
    ["Dấu hiệu khách đang nín thở?", ["Im lặng, mặt đỏ, môi mím, rep chậm dần", "Thở đều, nói chuyện được", "Cười nhiều", "Đổ mồ hôi tay"], "Thấy các dấu hiệu này thì nhắc lại nhịp thở ngay trong set."],
    ["Vì sao PT cần nghe tiếng thở của khách?", ["Biết khách đang ở pha nào và có quá sức không", "Để đếm số rep", "Để nhắc khách uống nước", "Không cần để ý"], "Tiếng thở là tín hiệu pha của rep và mức gắng sức."],
   ],
   rare: ["Khách cố tình nín thở ở rep 3. PT nói gì?", ["“Xuống, hít vào. Đứng thẳng, thở ra.”", "“Cố lên chị!”", "“Một, hai, ba…”", "“Chị thở sao cũng được”"], "Nhắc lại đúng 2 nhịp thở bằng cue ngắn, nói ngay trong set."] },

 { id: "hip", kj: "股", name: "Khớp Háng", lesson: "Goblet Squat · Nhịp Độ 3010", x: 585, y: 205,
   brief: ["Ôm tạ trước ngực: trọng tâm ra trước nên <b>thân tự dựng thẳng</b>. Đứng thẳng: mắt cá, gối, hông, vai trên 1 đường thẳng.", "4 bước: <b>Ôm tạ</b> (sát ngực, cùi trỏ ép thân) → <b>Hạ xuống</b> (hông và gối gập cùng lúc, gối theo ngón 2–3) → <b>Ở đáy</b> (khuỷu trong gối, không nghỉ) → <b>Đứng lên</b> (đạp cả bàn chân, hông và vai lên cùng tốc độ).", "<b>Nhịp Độ 3010</b>: 3 giây xuống, 0 dừng ở đáy, 1 giây lên, 0 dừng ở đỉnh.", "Dẫn bằng lời <b>“Xuống… chậm… chậm… BẬT!”</b>, không đếm số."],
   qs: [
    ["Nhịp Độ 3010 nghĩa là gì?", ["3 giây xuống, 0 dừng ở đáy, 1 giây lên, 0 dừng ở đỉnh", "3 rep, 0 nghỉ, 1 set, 0 tạ", "30 giây tập, 10 giây nghỉ", "3 giây lên, 1 giây xuống"], "Đọc 4 chữ số theo thứ tự: xuống, đáy, lên, đỉnh."],
    ["Vì sao ôm tạ trước ngực?", ["Tạ kéo trọng tâm ra trước nên thân tự dựng thẳng", "Để tạ nhẹ hơn", "Để khách không nhìn chân", "Để tập cơ tay là chính"], "Khách mới giữ lưng thẳng dễ hơn, PT nhìn rõ gối, hông, lưng."],
    ["Ở đáy squat, khuỷu tay nằm ở đâu?", ["Phía trong hai gối", "Phía ngoài hai gối", "Chạm sàn", "Giơ ngang vai"], "Khuỷu trong gối giúp gối mở đúng hướng và ngực không sụp."],
    ["Dẫn nhịp cho khách đúng cách là?", ["“Xuống… chậm… chậm… BẬT!”", "“Một, hai, ba, bốn…”", "Im lặng để khách tự tập", "“Nhanh lên chị!”"], "Từ nay PT dẫn nhịp bằng lời theo pha, không đứng đếm số."],
   ],
   rare: ["Khi đứng lên, hông bật lên trước vai thì sao?", ["Squat thành cúi lưng, tải dồn lên lưng", "Tốt, vì lên nhanh hơn", "Không ảnh hưởng gì", "Giúp gối an toàn hơn"], "Hông và vai phải lên cùng tốc độ. Cue: “Ngực lên cùng hông”."] },

 { id: "heart", kj: "心", name: "Trái Tim", lesson: "RIR · mức gắng sức", x: 392, y: 160,
   brief: ["<b>RIR</b> = số rep khách <b>còn làm thêm được, đúng kỹ thuật</b>, trước khi phải dừng.", "Thang: 0 hết sức · 1 còn 1 · <b>2–3 mục tiêu mỗi set</b> · 4+ còn quá nhẹ.", "Hỏi: <b>“Chị còn làm được mấy cái đúng kỹ thuật nữa?”</b> Đối chiếu với dấu hiệu: rep chậm, nín thở, kỹ thuật xấu dần.", "RIR 4+ → tăng tạ. RIR 0–1 mà kỹ thuật xấu → giảm tạ. Tối thiểu 3 set, chỉ đổi bài khi khách làm đúng."],
   qs: [
    ["RIR 2 nghĩa là gì?", ["Còn làm thêm được 2 rep đúng kỹ thuật", "Đã làm được 2 rep", "Nghỉ 2 phút", "Tập 2 set"], "RIR = Reps In Reserve: số rep còn để dành."],
    ["Mục tiêu RIR mỗi set là bao nhiêu?", ["2–3", "0", "5–6", "Không cần quan tâm"], "Đủ nặng để có tác dụng mà vẫn giữ được rep sạch."],
    ["Câu hỏi chuẩn để đo RIR?", ["“Chị còn làm được mấy cái đúng kỹ thuật nữa?”", "“Chị mệt không?”", "“Còn sức không chị?”", "“Chị tập vui không?”"], "Hỏi số rep đúng kỹ thuật, không hỏi cảm giác chung chung."],
    ["Khách nói: “chắc còn 5 cái nữa”. PT làm gì?", ["Tăng tạ hoặc độ khó ở set sau", "Giảm tạ", "Cho nghỉ hẳn", "Giữ nguyên mãi"], "RIR 4 trở lên là còn quá nhẹ."],
   ],
   rare: ["Khách RIR 0–1 và kỹ thuật bắt đầu xấu đi. PT làm gì?", ["Giảm tạ", "Tăng tạ", "Bảo khách cố thêm 5 rep", "Đổi sang bài khác ngay"], "Giữ rep sạch là ưu tiên: giảm tạ rồi tiếp tục."] },

 { id: "spine", kj: "脊", name: "Cột Sống", lesson: "Quan sát 7 điểm · đường trọng lực", x: 455, y: 242,
   brief: ["7 điểm: chân đế trước (<b>ổn định, rộng chân, bàn chân, đùi</b>), thân trên sau (<b>góc lưng, điểm nhìn, cùi trỏ</b>).", "Góc nhìn: <b>ngang</b> thấy lưng, độ sâu, gót · <b>chéo 45°</b> thấy rõ gối đổ vào. Đổi góc giữa set.", "Thứ tự sửa: <b>an toàn</b> (lưng, gối) → <b>biên độ</b> (độ sâu, gót) → <b>nhịp</b>. Cue tối đa 5 chữ, nói khi lỗi đang xảy ra, khen ngay khi khách sửa được.", "<b>Đường trọng lực</b> đi thẳng lên từ giữa bàn chân; lưng song song cẳng chân thì trọng tâm nằm đúng chỗ."],
   qs: [
    ["Đứng góc nào để bắt lỗi gối đổ vào rõ nhất?", ["Chéo 45°", "Chính diện", "Sau lưng", "Từ trên cao"], "Góc chéo thấy được cả hướng gối và chuyển động của hông."],
    ["Khách vừa gối đổ vào vừa xuống quá nhanh. Sửa gì trước?", ["Gối đổ vào", "Nhịp xuống", "Cả hai cùng lúc", "Chưa sửa gì"], "An toàn trước, rồi biên độ, cuối cùng mới đến nhịp. Mỗi lần 1 lỗi."],
    ["Cue chuẩn là thế nào?", ["Tối đa 5 chữ, nói khi lỗi đang xảy ra", "Giảng chi tiết sau khi hết set", "Càng dài càng rõ", "Chỉ nói khi khách hỏi"], "Ví dụ: “Gót bám sàn!”, “Gối theo mũi chân”."],
    ["Điểm nào KHÔNG thuộc 7 điểm quan sát?", ["Màu giày của khách", "Điểm nhìn", "Cùi trỏ", "Góc lưng"], "7 điểm: ổn định, rộng chân, bàn chân, đùi, góc lưng, điểm nhìn, cùi trỏ."],
   ],
   rare: ["Đường trọng lực đi thẳng lên từ giữa bàn chân. Muốn trọng tâm khách nằm đúng trên đường này, lưng nên thế nào?", ["Song song với cẳng chân", "Thẳng đứng như cột nhà", "Gần nằm ngang với sàn", "Đổ về trước nhiều hơn cẳng chân"], "Lưng đổ nhiều hơn cẳng chân thì lưng dưới gánh nặng; trọng tâm ra mũi chân thì gót nhấc."] },

 { id: "hand", kj: "手", name: "Bàn Tay", lesson: "Tác phong huấn luyện", x: 520, y: 98,
   brief: ["<b>Cách 1–1,2 m</b>, khoảng một sải tay: đủ gần để đỡ kịp, đủ xa để nhìn cả người.", "<b>Không đứng trực diện</b>: đứng góc ngang hoặc chéo 45°.", "<b>Chạm tối đa 3 điểm</b>, đúng chỗ cần sửa.", "<b>Không ngồi bệt</b>, cần nhìn thấp thì khuỵu gối. <b>Tay để tự do</b>: không khoanh trước ngực, không chắp sau hông."],
   qs: [

    ["Chạm khách tối đa mấy điểm?", ["3 điểm", "1 điểm", "5 điểm", "Không giới hạn"], "Chạm ít, đúng chỗ thì khách hiểu ngay cần sửa gì."],
    ["Cần nhìn thấp để xem gót khách, PT làm gì?", ["Khuỵu gối", "Ngồi bệt xuống sàn", "Nằm xuống sàn", "Bảo khách đứng lên bục"], "Luôn sẵn sàng di chuyển và hỗ trợ, giữ hình ảnh chuyên nghiệp."],
    ["Tư thế tay nào bị cấm khi kèm khách?", ["Khoanh tay trước ngực hoặc chắp tay sau hông", "Chỉ tay dẫn hướng", "Thả lỏng hai bên", "Đỡ nhẹ khi khách mất thăng bằng"], "Tay tự do thì sẵn sàng đỡ, chỉ dẫn và khách thấy PT cởi mở."],
   ],
   rare: ["Vì sao không đứng trực diện trước mặt khách?", ["Không thấy góc lưng, hướng gối, gót và dễ tạo áp lực", "Vì trước mặt khách có gương", "Vì dễ bị khách va vào", "Không có lý do cụ thể"], "Góc ngang và chéo 45° mới thấy được các điểm quan trọng."] },

 { id: "brain", kj: "脳", name: "Đại Não", lesson: "Góc khoa học · ROM", x: 98, y: 120,
   brief: ["<b>ROM</b>: biên độ chuyển động khách làm thoải mái, không đau ở khớp, gân. Mỗi khách một ROM.", "Độ sâu chuẩn: <b>sâu nhất mà lưng còn thẳng, gót còn bám và không đau</b>.", "<b>Biên độ</b> là yếu tố kỹ thuật quan trọng nhất: tập hết biên độ, chú trọng vị trí cơ dài.", "Nhịp độ khoảng <b>2–8 giây/rep</b> đều hiệu quả. <b>Không có kỹ thuật hoàn hảo chung</b> cho tất cả."],
   qs: [

    ["Độ sâu chuẩn trong squat của một khách là?", ["Sâu nhất mà lưng còn thẳng, gót còn bám và không đau", "Mông chạm sàn với mọi khách", "Chỉ xuống một phần tư", "Bằng độ sâu của PT"], "Độ sâu theo ROM của từng khách."],

/* ---------- luật chơi và tính điểm ---------- */
const gidOK = (k) => TD[k] && ST && TD[k].gid === ST.gid;

  const res = {}, comm = { c: 0, t: 0, z: {} }, si = ST ? ST.si : -1, act = activeTeams();

  const lastQ = (s) => s < si || (s === si && (ST.ph === "rev" || ST.ph === "end"));
  for (let s = 0; s < STEPS.length && s <= si; s++) {
    const st = STEPS[s];
    if (st.t === "q" && lastQ(s)) {

      for (const t of act) {
        const r = res[t.k], a = ansOf(t.k, s), ok = !!a && a.c === st.a, risky = st.rare && riskOf(t.k, st.zi) === "risky";
        comm.t++; comm.z[st.zi].t++; if (ok) { comm.c++; comm.z[st.zi].c++; }
        let pts = 0, dsh = 0;
        if (r.alive) {
          if (ok) { pts = Math.round((100 + 50 * Math.max(0, 1 - a.ms / (durOf(st) * 1000))) * (risky ? 2 : 1)); r.score += pts; r.got++; if (!st.rare) r.zc[st.zi] = (r.zc[st.zi] || 0) + 1; if (risky && r.sh < MAXSH) { r.sh++; dsh = 1; } }

}

/* ---------- điều khiển của người tổ chức ---------- */
function newGame() { writeState({ gid: "g" + Date.now().toString(36), si: -1, ph: "lobby", act: ST?.act || [], man: {}, mrisk: {}, oxy: 0 }, true); }
function goStep(si) {
  if (si >= STEPS.length) return writeState({ si: STEPS.length - 1, ph: "end" });

}

}

/* ---------- CỰ LONG THẦN: thân rắn uốn khúc, đi từ đầu (khu 1) tới đuôi (khu 8) ---------- */

  for (let i = 0; i <= N; i++) { const u = 0.05 + (i / N) * 0.95, [x, y] = GOD(u), [x2, y2] = GOD(Math.min(1, u + 0.004)), a = Math.atan2(y2 - y, x2 - x) + Math.PI / 2, w = GODW(u); top.push([x - Math.cos(a) * w, y - Math.sin(a) * w]); bot.push([x + Math.cos(a) * w, y + Math.sin(a) * w]); }

  const leg = (u, dir, claw) => { const [x, y] = GOD(u), w = GODW(u), y0 = y + dir * w * 0.8, kx = x + 26, ky = y0 + dir * 46, fx = x + 8, fy = ky + dir * 40;
    return `<path class="limb" d="M${f(x - 10)} ${f(y0)} L${f(kx)} ${f(ky)} L${f(fx)} ${f(fy)}"/>` + (claw ? [-14, 0, 14].map((d) => `<path class="claw" d="M${f(fx)} ${f(fy)} l${d} ${dir * 16}"/>`).join("") : ""); };

    <path class="horn" d="M${hx - 20} ${hy - 50} Q${hx - 60} ${hy - 110} ${hx - 10} ${hy - 120} Q${hx - 30} ${hy - 90} ${hx + 8} ${hy - 52}Z"/><path class="horn" d="M${hx + 18} ${hy - 48} Q${hx + 40} ${hy - 105} ${hx + 70} ${hy - 100} Q${hx + 44} ${hy - 82} ${hx + 36} ${hy - 40}Z"/>
    <ellipse cx="${hx - 8}" cy="${hy}" rx="70" ry="58"/><path class="jaw" d="M${hx - 62} ${hy + 20} Q${hx - 80} ${hy + 60} ${hx - 30} ${hy + 64} L${hx - 18} ${hy + 40}Z"/><path class="jaw" d="M${hx - 74} ${hy - 6} l-22 -8 l10 18Z"/>

/* ---------- bản đồ cơ thể Cự Thần ---------- */
const LBL = Object.fromEntries(ZONES.map((z, i) => [z.id, i === 0 ? [0, 84, "middle"] : i === 7 ? [0, -36, "middle"] : z.y > 178 ? [0, -36, "middle"] : [0, 50, "middle"]]));

#fxl>*{position:absolute}
.fl{font:900 30px/1 var(--f);transform:translate(-50%,-50%);animation:fl 1.6s ease-out forwards;text-shadow:0 2px 12px #000;white-space:nowrap}

.flash{inset:0;animation:flash .7s ease-out forwards}@keyframes flash{from{opacity:.9}to{opacity:0}}
#app.shk{animation:shk .45s}#app.shk2{animation:shk2 .8s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes shk2{10%{transform:translate(-16px,8px) rotate(-.4deg)}25%{transform:translate(14px,-9px) rotate(.4deg)}40%{transform:translate(-11px,6px)}55%{transform:translate(9px,-5px)}70%{transform:translate(-6px,3px)}85%{transform:translate(3px,-2px)}}
/* giấy in nhiệt */
#prt{left:24px;bottom:16px;width:min(440px,38vw);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pp{background:linear-gradient(#e9b866,#d9a24f);color:#3b2412;font:700 13.5px/1.4 var(--mono);letter-spacing:.5px;text-transform:uppercase;padding:12px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 30px rgba(120,60,10,.25);clip-path:polygon(0 4%,3% 0,7% 4%,11% 0,15% 4%,19% 0,23% 4%,27% 0,31% 4%,35% 0,39% 4%,43% 0,47% 4%,51% 0,55% 4%,59% 0,63% 4%,67% 0,71% 4%,75% 0,79% 4%,83% 0,87% 4%,91% 0,95% 4%,100% 0,100% 100%,0 100%);animation:ppin .5s ease-out both;max-width:100%}

.tape{position:absolute;left:20%;right:20%;top:5%;height:58px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}

.cur{position:absolute;left:0;right:0;top:87%;text-align:center;font:700 clamp(16px,1.6vw,24px) var(--mono);color:#e7b54c;letter-spacing:3px;animation:blink .7s steps(1) infinite}

.cine.rare{background:radial-gradient(ellipse at center,#2a0306,#000 70%);animation:cin .2s both,rr .5s steps(1) infinite}

/* mất tín hiệu */

.crt-on{inset:0;background:#000;animation:crt .9s ease-out forwards}.crt-on::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:#cfe;box-shadow:0 0 30px #9fd8b8;animation:crtl .9s ease-out forwards}

.ban{left:50%;top:86px;transform:translateX(-50%);font:700 22px var(--mono);letter-spacing:4px;color:#e7b54c;background:rgba(0,0,0,.72);border:1px solid #5a4520;padding:8px 20px;border-radius:6px;animation:ban 1.6s ease-out forwards;white-space:nowrap}
